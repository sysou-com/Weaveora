# ===== Weaveora API 配置（v1.5/v1.6/v2.0 裁定）=====
# dev profile 连本机 PG weaveora_dev + Redis db1；生产连 VPS PG weaveora + Redis db0。
# 密钥一律走环境变量 / 未提交的 application-local.yml，禁止入仓库。

spring:
  application:
    name: weaveora-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 实体与 Flyway 双写，禁止 update（硬性指令 13）
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

weaveora:
  env: ${WEAVEORA_ENV:test}        # prod|test；key 前缀 weaveora:{env}:*
  security:
    jwt:
      secret: ${WEAVEORA_JWT_SECRET:}          # 必填：生产/开发由环境变量注入
      access-ttl: 15m
      refresh-ttl: 14d
  billing:
    mode: ${WEAVEORA_BILLING_MODE:simplified}  # wallet|simplified（v1.3 #14）
    simplified:
      # §22.2 简化额度：全免费，仅配额/限频（Redis 每日计数，日切零点）
      max-director-day: ${WEAVEORA_QUOTA_DIRECTOR_DAY:20}
      max-stills-day: ${WEAVEORA_QUOTA_STILLS_DAY:200}
      max-clip-seconds-day: ${WEAVEORA_QUOTA_CLIP_SECONDS_DAY:600}
  video:
    # W8 长片编排底座：单项目目标时长上限（3–5 分钟=180–300s；默认 300s，可按引擎能力调整）
    max-duration-sec: ${WEAVEORA_VIDEO_MAX_DURATION_SEC:300}
    # W8 分段导演：单次导演计划时长上限（超过则自动按 ≤此值分 K 段，逐段生成后合并）
    plan-max-sec: ${WEAVEORA_VIDEO_PLAN_MAX_SEC:60}
  llm:
    base-url: ${WEAVEORA_LLM_BASE_URL:}
    api-key: ${WEAVEORA_LLM_API_KEY:}
    model: ${WEAVEORA_LLM_MODEL:}
  storage:
    mode: ${WEAVEORA_STORAGE_MODE:local}       # local|oss（v1.3 #13）
    local-dir: ${WEAVEORA_STORAGE_LOCAL_DIR:./data/storage}
  queue:
    job-stream: weaveora:${weaveora.env}:jobs
    dl-stream: weaveora:${weaveora.env}:jobs:dlq

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
